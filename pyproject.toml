[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-docs"
version = "0.1.0"
description = "Deterministic, verifiable claim corpora for AI-assisted codebase documentation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "evidence-docs contributors" }]
keywords = ["documentation", "ai-agents", "provenance", "claim-corpus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
evidence-docs = "evidence_docs.cli:main"

[project.urls]
Homepage = "https://github.com/shiki-yusuke/evidence-docs"
Repository = "https://github.com/shiki-yusuke/evidence-docs"
Issues = "https://github.com/shiki-yusuke/evidence-docs/issues"

[tool.setuptools.packages.find]
include = ["evidence_docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
