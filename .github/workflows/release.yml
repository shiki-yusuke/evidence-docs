# Release: v* tag -> build -> PyPI (Trusted Publisher, OIDC) -> GitHub Release assets.
# Modeled on agent-cost's release.yml (PyPI Trusted Publisher since 2026-09-29).
#
# Triggers: a `v*` tag push publishes. workflow_dispatch builds and checks; it also
# publishes only when dispatched on a tag ref (`gh workflow run release.yml --ref vX.Y.Z`),
# which is how a tag pushed before this workflow existed gets published.
# PyPI side: Trusted Publisher registered for shiki-yusuke/evidence-docs, workflow
# release.yml, environment pypi. No API token anywhere.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.1 twine==7.0.0
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Exactly one wheel and one sdist, and the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/evidence_docs-${TAG#v}-py3-none-any.whl"
          test -f "dist/evidence_docs-${TAG#v}.tar.gz"
      - name: Write SHA256SUMS (outside dist/ so publish only sees distributions)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checksums
          (cd dist && sha256sum *) > checksums/SHA256SUMS
          cat checksums/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: checksums/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publisher)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/
      # The action exchanges GitHub's OIDC token for a short-lived PyPI token.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Attach assets to GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: checksums/
      - name: Create the release if missing, then attach the exact published files
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "evidence-docs $TAG" --notes "See CHANGELOG.md for $TAG."
          fi
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz checksums/SHA256SUMS --clobber
