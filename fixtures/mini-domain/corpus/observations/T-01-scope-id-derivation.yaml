topic_id: T-01
observations:
  - observation_id: OBS-001
    topic_id: T-01
    claim_kind: behavior
    statement: >-
      resolve_task_scope_id returns a deterministic scope id derived from
      list_id when list_id is given and non-blank. Calling it twice with the
      same list_id always returns the same scope id.
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    negation_check: >-
      Removed the `list_id.strip()` guard's `is not None` clause so a blank
      list_id would fall through to the existing-list branch instead of the
      new-list branch; test_resolve_scope_id_stable_for_existing_list still
      passed (list_id="42" is unaffected), but
      test_resolve_scope_id_uses_new_list_token_when_list_id_blank went red
      as expected, confirming the test actually exercises this branch.
    subject_refs:
      - resolve_task_scope_id
    provenance:
