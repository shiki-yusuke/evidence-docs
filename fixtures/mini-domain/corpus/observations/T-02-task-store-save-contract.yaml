  - observation_id: OBS-005
    topic_id: T-02
    claim_kind: decision_record
    statement: >-
      Pruning old versions only after a successful write is a deliberate
      decision: pruning unconditionally would leave version metadata
      pointing at content that was never actually persisted if the write
      failed.
    origin: recorded
    epistemic_status: recorded_decision
    review_status: unreviewed
    conformance_status: matched
    subject_refs:
