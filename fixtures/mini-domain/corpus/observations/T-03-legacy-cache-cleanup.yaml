  - observation_id: OBS-007
    topic_id: T-03
    claim_kind: decision_record
    statement: >-
      An earlier design note called for legacy cache cleanup to be exposed
      as a module-level `purge_legacy_cache(scope_id, backend)` function.
      The implementation instead added it as a private
      `TaskStore._purge_legacy_cache()` method invoked from `__init__`.
      This deviation from the design note was accepted as-is (see
      docs/decisions/legacy-cleanup-placement.md): no caller needs to purge
      a scope without also opening a store for it.
    origin: recorded
    epistemic_status: recorded_decision
    review_status: unreviewed
    conformance_status: drifted
    subject_refs:
      - TaskStore._purge_legacy_cache
    provenance:
